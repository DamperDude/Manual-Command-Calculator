<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Command Calculator</title>
    <!-- Web App Standalone Mode Support for Android & iOS -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#121212">

    <style>
        :root {
            --app-bg: #121212;
            --card-bg: #1e1e1e;
            --blue-bg: #1a237e;
            --blue-border: #29b6f6;
            --blue-text: #e1f5fe;
            --green-bg: #1b5e20;
            --green-border: #66bb6a;
            --green-text: #e8f5e9;
            --text-main: #f5f5f5;
            --text-muted: #b0bec5;
            --danger-bg: #b71c1c;
            --danger-border: #ef5350;
            --clear-btn: #37474f;
            --clear-btn-hover: #455a64;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--app-bg);
            margin: 0;
            padding: 12px;
            color: var(--text-main);
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        h2 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
        }
        .clear-button {
            background-color: var(--clear-btn);
            color: var(--text-main);
            border: 1px solid #546e7a;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .clear-button:active {
            background-color: var(--clear-btn-hover);
        }
        .info-box {
            background-color: #263238;
            border-left: 4px solid var(--blue-border);
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 20px;
            color: var(--text-muted);
        }
        .section-header {
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            color: var(--text-muted);
            margin: 20px 0 10px 0;
        }
        .grid-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text-main);
        }
        input.blue-input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            background-color: var(--blue-bg);
            border: 2px solid var(--blue-border);
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            color: var(--blue-text);
            outline: none;
        }
        input.blue-input:focus {
            box-shadow: 0 0 0 3px rgba(41, 182, 246, 0.4);
        }
        .green-output {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            background-color: var(--green-bg);
            border: 2px solid var(--green-border);
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            color: var(--green-text);
            min-height: 48px;
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-row">
        <h2>Manual Command Calculator</h2>
        <button class="clear-button" onclick="clearCalculator()">Clear All</button>
    </div>
    
    <div class="info-box">
        <strong>Instructions:</strong> Enter measurements from print into the <strong>BLUE</strong> fields. 
	<div><strong>GREEN</strong> fields auto-populate results.</div>
    </div>

    <div class="section-header" style="color: var(--blue-border); margin-top: 36px; border-top: 1px solid #333; padding-top: 16px;">
        Print Specs
    </div>
    
    <div class="form-group">
        <label>Free Length / Full Ext @ Gas Force</label>
        <input type="number" step="any" id="freeLength" class="blue-input cal-input" placeholder="0.00" oninput="runCalculator()">
    </div>
    
    <div class="form-group">
        <label>Tube / Body Length</label>
        <input type="number" step="any" id="tubeLength" class="blue-input cal-input" placeholder="0.00" oninput="runCalculator()">
    </div>
    
    <div class="form-group">
        <label>Metal to Metal / Collapsed</label>
        <input type="number" step="any" id="metalToMetal" class="blue-input cal-input" placeholder="0.00" oninput="runCalculator()">
    </div>

    <div class="grid-row">
        <div class="form-group">
            <label>Design / A Dim</label>
            <input type="number" step="any" id="designDim" class="blue-input cal-input" placeholder="0.00" oninput="runCalculator()">
        </div>
        <div class="form-group">
            <label>Curb</label>
            <input type="number" step="any" id="curb" class="blue-input cal-input" placeholder="0.00" oninput="runCalculator()">
        </div>
    </div>

    <div class="section-header" style="color: var(--blue-border); margin-top: 36px; border-top: 1px solid #333; padding-top: 16px;">
        Manual Overrides
    </div>
    <div class="info-box" style="border-left-color: var(--danger-border); background-color: var(--danger-bg); font-size: 12px; margin-bottom: 12px; color: #ffebee;">
        Leave blank unless physical part specs vary from blueprint.
    </div>

    <div class="grid-row">
        <div class="form-group">
            <label>Manual Entry for Full Ext</label>
            <input type="number" step="any" id="overrideFullExt" class="blue-input" placeholder="Clear" oninput="runCalculator()">
        </div>
        <div class="form-group">
            <label>Manual Entry for Stickout</label>
            <input type="number" step="any" id="overrideStickout" class="blue-input" placeholder="Clear" oninput="runCalculator()">
        </div>
    </div>

        <!-- Section 1: Physical Measurements -->
     <div class="section-header" style="color: var(--green-border); margin-top: 36px; border-top: 1px solid #333; padding-top: 16px;">
        Measurement Results
    </div>
    
    <div class="grid-row">
        <div class="form-group">
            <label>Rod Full Ext</label>
            <div id="outFullExt" class="green-output">0.00</div>
        </div>
        <div class="form-group">
            <label>Stick Out</label>
            <div id="outStickout" class="green-output">0.00</div>
        </div>
    </div>

    <div class="form-group">
        <label>MOAT / Midstroke</label>
        <div id="outMidstroke" class="green-output">0.00</div>
    </div>

    <!-- Section 2: Hardware Controller Manual Commands -->
    <div class="section-header" style="color: var(--green-border); margin-top: 36px; border-top: 1px solid #333; padding-top: 16px;">
        Manual Commands
    </div>

    <div class="grid-row">
        <div class="form-group">
            <label>Design / A Dim Manual Command</label>
            <div id="outDesignCommand" class="green-output">0.00</div>
        </div>
        <div class="form-group">
            <label>Curb Manual Command</label>
            <div id="outCurbCommand" class="green-output">0.00</div>
        </div>
    </div>

    <div class="grid-row">
        <div class="form-group" style="grid-column: span 2;">
            <label>MOAT/Midstroke Manual Command</label>
            <div id="outMidstrokeCommand" class="green-output">0.00</div>
        </div>
    </div>

</div> <!-- End of .container -->


<script>
function runCalculator() {
    try {
        // 1. Safe extraction of input parameters
        const freeLength = parseFloat(document.getElementById('freeLength').value) || 0;
        const tubeLength = parseFloat(document.getElementById('tubeLength').value) || 0;
        const metalToMetal = parseFloat(document.getElementById('metalToMetal').value) || 0;
        const designDim = parseFloat(document.getElementById('designDim').value) || 0;
        const curb = parseFloat(document.getElementById('curb').value) || 0;
        
        const overrideFullExtVal = document.getElementById('overrideFullExt').value.trim();
        const overrideStickoutVal = document.getElementById('overrideStickout').value.trim();

        // 2. Corrected Spreadsheet Math Logic Realization
        // Rod Full Ext
        let finalFullExt = 0;
        if (overrideFullExtVal !== "") {
            finalFullExt = parseFloat(overrideFullExtVal) || 0;
        } else {
            finalFullExt = freeLength > tubeLength ? (freeLength - tubeLength) : 0;
        }

        // Stick Out
        let finalStickout = 0;
        if (overrideStickoutVal !== "") {
            finalStickout = parseFloat(overrideStickoutVal) || 0;
        } else {
            finalStickout = metalToMetal > tubeLength ? (metalToMetal - tubeLength) : 0;
        }

        // Design / A Dim Output Cell Calculation
        const finalDesignDimOut = designDim > tubeLength ? (designDim - tubeLength) : 0;

        // MOAT / Midstroke Output Cell Calculation
        const finalMidstrokeOut = finalFullExt > 0 ? (finalFullExt - 59.555) : 0;

        // Calculation of commands sent directly to the hardware controller
        const designCommand = finalFullExt > 0 ? (finalFullExt - finalDesignDimOut) : 0;
        const midstrokeCommand = finalFullExt > 0 ? ((finalFullExt - finalStickout) / 2.0) : 0;
        const curbCommand = (curb > 0 && tubeLength > 0) ? (finalFullExt + finalStickout - (curb - tubeLength)) : 0;

        // 3. Update Display UI Targets (Ensures Live Text Injection)
        document.getElementById('outFullExt').innerText = finalFullExt.toFixed(2);
        document.getElementById('outStickout').innerText = finalStickout.toFixed(2);
        document.getElementById('outMidstroke').innerText = finalMidstrokeOut.toFixed(2);
        document.getElementById('outDesignCommand').innerText = designCommand.toFixed(2);
        document.getElementById('outCurbCommand').innerText = curbCommand.toFixed(2);
        document.getElementById('outMidstrokeCommand').innerText = midstrokeCommand.toFixed(2);
        
    } catch (error) {
        console.error("Calculator Error Execution Halted: ", error);
    }
}

function clearCalculator() {
    // Clear value inputs across all entry targets
    document.getElementById('freeLength').value = "";
    document.getElementById('tubeLength').value = "";
    document.getElementById('metalToMetal').value = "";
    document.getElementById('designDim').value = "";
    document.getElementById('curb').value = "";
    document.getElementById('overrideFullExt').value = "";
    document.getElementById('overrideStickout').value = "";

    // Reset display results to structural baselines (Updated to .00 format)
    document.getElementById('outFullExt').innerText = "0.00";
    document.getElementById('outStickout').innerText = "0.00";
    document.getElementById('outMidstroke').innerText = "0.00";
    document.getElementById('outDesignCommand').innerText = "0.00";
    document.getElementById('outCurbCommand').innerText = "0.00";
    document.getElementById('outMidstrokeCommand').innerText = "0.00";
}

// 4. Automatically move focus to the next field on Enter keypress
document.addEventListener('DOMContentLoaded', () => {
    const inputs = Array.from(document.querySelectorAll('.cal-input'));
    
    inputs.forEach((input, index) => {
        input.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                event.preventDefault(); // Stop page submission/glitches
                
                const nextInput = inputs[index + 1];
                if (nextInput) {
                    nextInput.focus(); // Jump cursor to next field
                    nextInput.select(); // Highlight text for quick overwrite
                } else {
                    input.blur(); // Drop focus if on the final field
                }
            }
        });
    });
});
</script>
</body>
</html>
